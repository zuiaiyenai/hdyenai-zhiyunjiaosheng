worker_processes 1;

error_log logs/error.log notice;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        audio/mpeg mp3;
        audio/wav wav;
        video/mp4 mp4;
        font/woff woff;
        font/woff2 woff2;
    }

    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 60m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The browser sees nginx:8080 and treats these requests as same-origin.
    # Remove only that local Origin before proxying; preserve unknown origins
    # so Spring's CORS whitelist continues to reject cross-origin requests.
    map $http_origin $backend_origin {
        default $http_origin;
        "http://127.0.0.1:8080" "";
        "http://localhost:8080" "";
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root ../../src/main/resources/static;
        index index.html;

        access_log logs/access.log;
        error_log logs/error.log notice;

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $backend_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The feature-complete legacy UI calls backend routes from the site root.
        # Keep /api/ as the gateway prefix while preserving those existing contracts.
        location ~ ^/(?:accessibility|admin|api/tasks|asr|audio/tasks|courseware|dialect|download|optimize/tasks|sound_clone|speaking_practice|user|video/tasks|video_voice_swap|voice|voice_library)(?:/|$) {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $backend_origin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
        location ~* ^/assets/(?:tts-stream-player|dialect-stream-player|preview-lock|courseware-lock|video-layout|audio-recorder|report-data|pcm-recorder-worklet)\.(?:js|css)$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.html$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|woff2?|ttf|mp3|wav|mp4)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
