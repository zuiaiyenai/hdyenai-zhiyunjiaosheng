spring:
  application:
    name: tts
  profiles:
    default: local
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:9}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:1s}"
      timeout: "${REDIS_TIMEOUT:2s}"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/zhiyunjiaos?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: "${SERVER_PORT:8081}"

app:
  redis:
    enabled: "${REDIS_ENABLED:false}"
    dialogue-session-ttl: "${REDIS_DIALOGUE_SESSION_TTL:30m}"
  upload-dir: ./uploads/voice_samples
  asr-dir: ./uploads/asr
  ppt-dir: ./uploads/ppt
  speaking-dir: ./uploads/speaking
  video-dir: ./uploads/video
  output-dir: ./uploads/output
  ffmpeg-path: ffmpeg
  accessibility-dir: ./uploads/accessibility
  courseware-dir: ./uploads/courseware

jwt:
  secret: "${JWT_SECRET}"
  expiration-seconds: "${JWT_EXPIRATION_SECONDS:7200}"

security:
  auth:
    enabled: "${AUTH_ENABLED:true}"

moonshot:
  api:
    key: "${MOONSHOT_API_KEY:}"
    base-url: "${MOONSHOT_API_BASE_URL:https://api.moonshot.cn/v1}"
    model: "${MOONSHOT_API_MODEL:moonshot-v1-32k}"

asr:
  api:
    url: "${ASR_API_URL:http://127.0.0.1:9977/asr}"
    token: "${ASR_API_TOKEN:}"

cosyvoice:
  api:
    url: "${COSYVOICE_API_URL:}"
    key: "${COSYVOICE_API_KEY:}"

tts:
  api:
    url: "${TTS_API_URL:http://127.0.0.1:9966/tts}"
  output-root: "${TTS_OUTPUT_ROOT:./uploads/output}"

sound-clone:
  api:
    url: "${SOUND_CLONE_API_URL:http://127.0.0.1:9880/tts}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
