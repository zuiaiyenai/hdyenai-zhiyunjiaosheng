spring:
  application:
    name: tts
  profiles:
    default: local
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:9}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:1s}"
      timeout: "${REDIS_TIMEOUT:2s}"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/zhiyunjiaos?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: "${SERVER_PORT:8081}"

app:
  redis:
    enabled: "${REDIS_ENABLED:false}"
    dialogue-session-ttl: "${REDIS_DIALOGUE_SESSION_TTL:30m}"
  upload-dir: ./uploads/voice_samples
  asr-dir: ./uploads/asr
  ppt-dir: ./uploads/ppt
  speaking-dir: ./uploads/speaking
  video-dir: ./uploads/video
  output-dir: ./uploads/output
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  accessibility-dir: ./uploads/accessibility
  courseware-dir: ./uploads/courseware

jwt:
  secret: "${JWT_SECRET}"
  expiration-seconds: "${JWT_EXPIRATION_SECONDS:7200}"

security:
  auth:
    enabled: "${AUTH_ENABLED:true}"

moonshot:
  api:
    key: "${MOONSHOT_API_KEY:}"
    base-url: "${MOONSHOT_API_BASE_URL:https://api.moonshot.cn/v1}"
    model: "${MOONSHOT_API_MODEL:kimi-k2.6}"

asr:
  api:
    url: "${ASR_API_URL:http://127.0.0.1:9977/asr}"
    token: "${ASR_API_TOKEN:}"

tts:
  api:
    url: "${TTS_API_URL:http://127.0.0.1:9880/tts}"
  sample-library-path: "${TTS_SAMPLE_LIBRARY_PATH:D:/BaiduNetdiskDownload/GPT-SoVITS-v2-240821/Sound_sample_library}"
  default-voice: "${TTS_DEFAULT_VOICE:样本}"
  english-voice: "${TTS_ENGLISH_VOICE:Katherine_Maher_reference}"
  output-root: "${TTS_OUTPUT_ROOT:./uploads/output}"

sound-clone:
  api:
    url: "${SOUND_CLONE_API_URL:http://127.0.0.1:9880/tts}"

aliyun:
  nls:
    app-key: "${ALIYUN_NLS_APP_KEY:}"
    token: "${ALIYUN_NLS_TOKEN:}"
    websocket-url: "${ALIYUN_NLS_WEBSOCKET_URL:wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1}"
    access-key-id: "${ALIYUN_AK_ID:}"
    access-key-secret: "${ALIYUN_AK_SECRET:}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
