spring:
  application:
    name: tts
  profiles:
    default: nodb
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:9}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:1s}"
      timeout: "${REDIS_TIMEOUT:2s}"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhiyunjiaos}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      connection-timeout: "${DB_CONNECTION_TIMEOUT:3000}"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: "${FLYWAY_BASELINE_ON_MIGRATE:false}"
    validate-on-migrate: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: "${SERVER_PORT:8081}"

app:
  storage:
    provider: "${OBJECT_STORAGE_PROVIDER:local}"
    local-root: "${OBJECT_STORAGE_LOCAL_ROOT:./uploads}"
  observability:
    environment: "${APP_ENVIRONMENT:local}"
    external-services-required: "${EXTERNAL_SERVICES_REQUIRED:false}"
    probe-timeout: "${EXTERNAL_SERVICE_PROBE_TIMEOUT:2s}"
    tts-health-url: "${TTS_HEALTH_URL:http://127.0.0.1:9880/tts}"
    asr-health-url: "${ASR_HEALTH_URL:http://127.0.0.1:9977/health}"
  cleanup:
    retry-delay: "${FILE_CLEANUP_RETRY_DELAY:5m}"
  tasks:
    worker-count: "${TASK_WORKER_COUNT:2}"
    poll-interval: "${TASK_POLL_INTERVAL:250ms}"
    timeout: "${TASK_TIMEOUT:15m}"
    heartbeat-interval: "${TASK_HEARTBEAT_INTERVAL:10s}"
    stale-after: "${TASK_STALE_AFTER:45s}"
    recovery-interval: "${TASK_RECOVERY_INTERVAL:15s}"
    retry-base-delay: "${TASK_RETRY_BASE_DELAY:2s}"
    retry-max-delay: "${TASK_RETRY_MAX_DELAY:1m}"
    shutdown-grace: "${TASK_SHUTDOWN_GRACE:10s}"
    per-user-concurrency: "${TASK_PER_USER_CONCURRENCY:2}"
    global-queue-limit: "${TASK_GLOBAL_QUEUE_LIMIT:200}"
    admission-retry-after: "${TASK_ADMISSION_RETRY_AFTER:5s}"
  media:
    process-timeout: "${MEDIA_PROCESS_TIMEOUT:10m}"
  resources:
    acquire-timeout: "${RESOURCE_ACQUIRE_TIMEOUT:50ms}"
    tts:
      max-concurrent: "${TTS_MAX_CONCURRENT:1}"
    asr:
      max-concurrent: "${ASR_MAX_CONCURRENT:1}"
    ffmpeg:
      max-concurrent: "${FFMPEG_MAX_CONCURRENT:1}"
    courseware:
      max-concurrent: "${COURSEWARE_MAX_CONCURRENT:1}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
  security:
    password:
      min-length: "${PASSWORD_MIN_LENGTH:8}"
      max-length: "${PASSWORD_MAX_LENGTH:128}"
    login-rate-limit:
      max-failures: "${LOGIN_MAX_FAILURES:5}"
      window: "${LOGIN_FAILURE_WINDOW:10m}"
      lock-duration: "${LOGIN_LOCK_DURATION:15m}"
      fallback-max-entries: "${LOGIN_RATE_LIMIT_FALLBACK_MAX_ENTRIES:10000}"
    endpoint-rate-limit:
      enabled: "${ENDPOINT_RATE_LIMIT_ENABLED:true}"
      max-requests: "${ENDPOINT_RATE_LIMIT_MAX_REQUESTS:120}"
      window: "${ENDPOINT_RATE_LIMIT_WINDOW:1m}"
      fallback-max-entries: "${ENDPOINT_RATE_LIMIT_FALLBACK_MAX_ENTRIES:10000}"
    trusted-proxies: "${TRUSTED_PROXIES:127.0.0.1,::1}"
  upload:
    audio-max-size: "${UPLOAD_AUDIO_MAX_SIZE:20MB}"
    image-max-size: "${UPLOAD_IMAGE_MAX_SIZE:10MB}"
    presentation-max-size: "${UPLOAD_PRESENTATION_MAX_SIZE:30MB}"
    video-max-size: "${UPLOAD_VIDEO_MAX_SIZE:50MB}"
    text-max-size: "${UPLOAD_TEXT_MAX_SIZE:2MB}"
    user-quota: "${UPLOAD_USER_QUOTA:500MB}"
    image-max-width: "${UPLOAD_IMAGE_MAX_WIDTH:4096}"
    image-max-height: "${UPLOAD_IMAGE_MAX_HEIGHT:4096}"
    presentation-max-slides: "${UPLOAD_PRESENTATION_MAX_SLIDES:200}"
    audio-max-duration-seconds: "${UPLOAD_AUDIO_MAX_DURATION_SECONDS:1800}"
  redis:
    enabled: "${REDIS_ENABLED:false}"
    dialogue-session-ttl: "${REDIS_DIALOGUE_SESSION_TTL:30m}"
  upload-dir: ./uploads/voice_samples
  asr-dir: ./uploads/asr
  ppt-dir: ./uploads/ppt
  speaking-dir: ./uploads/speaking
  video-dir: ./uploads/video
  output-dir: ./uploads/output
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  accessibility-dir: ./uploads/accessibility
  courseware-dir: ./uploads/courseware

jwt:
  secret: "${JWT_SECRET}"
  expiration-seconds: "${JWT_EXPIRATION_SECONDS:7200}"

security:
  auth:
    enabled: "${AUTH_ENABLED:true}"

moonshot:
  api:
    key: "${MOONSHOT_API_KEY:}"
    base-url: "${MOONSHOT_API_BASE_URL:https://api.moonshot.cn/v1}"
    model: "${MOONSHOT_API_MODEL:kimi-k2.6}"

asr:
  api:
    url: "${ASR_API_URL:http://127.0.0.1:9977/asr}"
    token: "${ASR_API_TOKEN:}"

tts:
  api:
    url: "${TTS_API_URL:http://127.0.0.1:9880/tts}"
  sample-library-path: "${TTS_SAMPLE_LIBRARY_PATH:D:/BaiduNetdiskDownload/GPT-SoVITS-v2-240821/Sound_sample_library}"
  default-voice: "${TTS_DEFAULT_VOICE:样本}"
  english-voice: "${TTS_ENGLISH_VOICE:Katherine_Maher_reference}"
  output-root: "${TTS_OUTPUT_ROOT:./uploads/output}"

sound-clone:
  api:
    url: "${SOUND_CLONE_API_URL:http://127.0.0.1:9880/tts}"

aliyun:
  oss:
    endpoint: "${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}"
    bucket-name: "${ALIYUN_OSS_BUCKET:hdyenai001}"
    access-key-id: "${ALIYUN_OSS_ACCESS_KEY_ID:${aliyun.nls.access-key-id:}}"
    access-key-secret: "${ALIYUN_OSS_ACCESS_KEY_SECRET:${aliyun.nls.access-key-secret:}}"
    connection-timeout: "${ALIYUN_OSS_CONNECTION_TIMEOUT:5s}"
    socket-timeout: "${ALIYUN_OSS_SOCKET_TIMEOUT:30s}"
    request-timeout: "${ALIYUN_OSS_REQUEST_TIMEOUT:2m}"
    max-connections: "${ALIYUN_OSS_MAX_CONNECTIONS:64}"
  nls:
    app-key: "${ALIYUN_NLS_APP_KEY:}"
    token: "${ALIYUN_NLS_TOKEN:}"
    websocket-url: "${ALIYUN_NLS_WEBSOCKET_URL:wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1}"
    access-key-id: "${ALIYUN_AK_ID:}"
    access-key-secret: "${ALIYUN_AK_SECRET:}"

management:
  server:
    port: "${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8081}}"
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db,redis,externalServices
          show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
      environment: "${APP_ENVIRONMENT:local}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
