spring:
  mvc:
    async:
      request-timeout: "30m"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

app:
  storage:
    provider: local
    local-root: ./target/test-uploads/objects
  redis:
    enabled: false
  upload-dir: ./target/test-uploads/voice
  asr-dir: ./target/test-uploads/asr
  ppt-dir: ./target/test-uploads/ppt
  courseware-dir: ./target/test-uploads/courseware
  speaking-dir: ./target/test-uploads/speaking
  video-dir: ./target/test-uploads/video
  output-dir: ./target/test-uploads/output
  accessibility-dir: ./target/test-uploads/accessibility
  ffmpeg-path: ffmpeg

jwt:
  secret: test-secret-that-is-long-enough-for-automated-tests
  expiration-seconds: 7200

security:
  auth:
    enabled: false

moonshot:
  api:
    key: ""
    base-url: http://127.0.0.1:1
    model: test-model

asr:
  api:
    url: http://127.0.0.1:1/asr
    token: ""

tts:
  api:
    url: http://127.0.0.1:1/tts
  sample-library-path: ./target/test-samples
  default-voice: test-voice
  output-root: ./target/test-uploads/output

sound-clone:
  api:
    url: http://127.0.0.1:1/tts

aliyun:
  oss:
    endpoint: "${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}"
    bucket-name: "${ALIYUN_OSS_BUCKET:hdyenai001}"
    access-key-id: "${ALIYUN_OSS_ACCESS_KEY_ID:${aliyun.nls.access-key-id:}}"
    access-key-secret: "${ALIYUN_OSS_ACCESS_KEY_SECRET:${aliyun.nls.access-key-secret:}}"
    connection-timeout: 5s
    socket-timeout: 30s
    request-timeout: 2m
    max-connections: 64
